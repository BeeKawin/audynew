; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor settings
monitor_speed = 115200

; Libraries
lib_deps =
    ; BLE support (included with ESP32 Arduino core)
    ; NeoPixel/WS2812B LED strip
    adafruit/Adafruit NeoPixel @ ^1.12.0
    ; OLED Display (optional)
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    ; I2C support
    adafruit/Adafruit BusIO @ ^1.14.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Increase BLE TX power for better range
    -DCONFIG_BTDM_CTRL_TX_POWER_DBM_3=y

; Upload settings
; upload_port = COM3  ; Change to your port
; upload_speed = 921600

; Partition scheme (for larger apps)
board_build.partitions = default.csv
